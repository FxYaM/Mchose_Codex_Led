name: Windows checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vendor/package-lock.json
      - run: npm.cmd --prefix vendor ci
      - run: npm.cmd run check
      - run: npm.cmd test
      - name: Check native dependency without opening a device
        run: node -e 'require("./vendor/node_modules/node-hid")'
